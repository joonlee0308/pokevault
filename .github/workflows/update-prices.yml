name: Update card prices
on:
  schedule:
    - cron: "30 4 * * *"   # every day, after TCGdex refreshes prices
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_cards.py
      - run: |
          git config user.name "PokeVault bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update card prices $(date -u +%F)"
          git push
